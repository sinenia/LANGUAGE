<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 학습 플래너</title><style>body{max-width:900px;margin:auto;padding:24px;background:#fbfaf5;color:#243c36;font:16px/1.7 system-ui}button,select,input,textarea{font:inherit;padding:10px;border:1px solid #bdc9c0;border-radius:8px;margin:4px}button,a{cursor:pointer}article,section{background:white;padding:20px;border:1px solid #ddd;border-radius:12px;margin:16px 0}textarea{width:90%;min-height:90px}.selected{background:#cee6d4}small{color:#58665f}</style><a href="index.html">← 기존 학습지·복습 노트</a><h1>나의 학습 플래너</h1><p>15일 계획 · 연수 준비 · 의학용어 · 랜덤 퀴즈 · 사전</p><nav id="nav"></nav><main id="main"></main><script>
const $=s=>document.querySelector(s);function el(t,s){const x=document.createElement(t);if(s!==undefined)x.textContent=s;return x}function button(s,fn){const b=el('button',s);b.onclick=fn;return b}let data={};try{data=JSON.parse(localStorage.getItem('language-hub-v1')||'{}')}catch{}function save(){try{localStorage.setItem('language-hub-v1',JSON.stringify(data))}catch{alert('저장 공간을 확인하세요.')}}let bank=[];const med=[['cardio-','심장'],['nephro-','콩팥'],['hepato-','간'],['neuro-','신경'],['derm-','피부'],['gastr-','위'],['osteo-','뼈'],['arthro-','관절'],['hemo-','혈액'],['myo-','근육'],['oto-','귀'],['rhino-','코'],['tachy-','빠른'],['brady-','느린'],['-itis','염증']];function medical(){return med.map(([w,m],i)=>{const opts=[m,...med.filter((v,j)=>j!==i).slice(0,4).map(v=>v[1])];const offset=i%5;const o=opts.slice(offset).concat(opts.slice(0,offset));return{type:'mc',prompt:w+'의 의미는?',options:o,answer:o.indexOf(m),explanation:w+'는 '+m+'을 뜻하는 의학용어 구성요소입니다.',language:'medical'}})}
const topics={en:'문장구조|시제|수일치|수동태|조동사|전치사|1주 복습|접속사|관계사|준동사|비교|Part 6 문맥|Part 7 안내문|Part 7 이메일|종합 점검',ja:'가나·인사|자기소개|숫자·시간|장소|물건·지시어|주문|1주 복습|일과|동사 정중형|부정·과거|이동|부탁|쇼핑|여행 대화|종합 점검',es:'소리·강세|인사·소개|ser|estar·위치|명사 성·수|숫자·시간|1주 복습|현재형|의문문|주문|gustar|이동|쇼핑|일과|종합 점검'};const names={en:'영어',ja:'일본어',es:'스페인어'};function plans(){const m=$('#main');m.replaceChildren(el('h2','언어별 15일 계획'));m.append(el('p','계획은 미리 구성되어 있습니다. 기존 문제은행의 연습은 주제별 완성 학습지와 다르며 반복될 수 있습니다.'));for(const lang of Object.keys(topics)){const s=el('section');s.append(el('h3',names[lang]));topics[lang].split('|').forEach((topic,i)=>{const a=el('article');a.append(el('b','Day '+(i+1)+' · '+topic),el('p','단어 → 개념 읽기 → 문장 적용 → 헷갈린 항목 복습'));const key='plan-'+lang+'-'+i;const b=button(data[key]?'✓ 완료':'스스로 완료 표시',()=>{data[key]=!data[key];save();plans()});a.append(b,button('기존 문제은행 연습',()=>quiz(bank.filter(q=>q.language===lang).slice(0,5),'plan-practice-'+lang+'-'+i)));s.append(a)});m.append(s)}}
const au=[['Could you repeat that more slowly?','다시 조금 천천히 말해 주시겠어요?'],['Where can I collect my student card?','학생증은 어디에서 받을 수 있나요?'],['I would like to reschedule my appointment.','예약 일정을 변경하고 싶습니다.'],['Is this fee included in the tuition?','이 비용은 수업료에 포함되어 있나요?'],['Could I have an extension for this assignment?','이 과제의 제출 기한을 연장할 수 있을까요?'],['Which platform does the train leave from?','기차는 어느 승강장에서 출발하나요?'],['I have a booking under the name Kim.','김이라는 이름으로 예약했습니다.'],['Does the rent include electricity?','임대료에 전기료가 포함되어 있나요?'],['How do I connect to the campus Wi-Fi?','교내 와이파이에 어떻게 연결하나요?'],['Could you explain the assessment criteria?','평가 기준을 설명해 주시겠어요?'],['I am looking for the international student office.','유학생 지원 사무실을 찾고 있습니다.'],['When is the orientation session?','오리엔테이션은 언제인가요?'],['Where should I submit the form?','양식은 어디에 제출해야 하나요?'],['I would like to open a bank account.','은행 계좌를 개설하고 싶습니다.'],['Could I see the timetable?','시간표를 볼 수 있을까요?'],['Is attendance compulsory?','출석이 필수인가요?'],['I need help understanding the instructions.','안내 사항을 이해하는 데 도움이 필요합니다.'],['What is the deadline for registration?','등록 마감일은 언제인가요?'],['Are there any rooms available?','이용 가능한 방이 있나요?'],['Could you recommend a suitable course?','적절한 강좌를 추천해 주시겠어요?']];function australia(){return au.map(([w,m],i)=>{const opts=[m,...au.filter((v,j)=>j!==i).slice(0,4).map(v=>v[1])];const n=i%5,o=opts.slice(n).concat(opts.slice(0,n));return{prompt:'연수 상황에서 다음 말의 뜻은? '+w,options:o,answer:o.indexOf(m),explanation:w+' → '+m,language:'en'}})}
function quiz(qs,key){const m=$('#main');m.replaceChildren(el('h2',key.startsWith('au')?'호주 연수 준비 영어 · 20문항':key.startsWith('med')?'의학용어 구성요소 · 15문항':'혼합·문제은행 연습'));m.append(el('p','연습용 원작 문제입니다. 공인시험 모의고사·점수 예측이 아닙니다. 매일 세트는 같은 문제은행을 순서를 바꿔 복습합니다.'));const record=data[key]||(data[key]={answers:{},confidence:{},note:''});qs.forEach((q,i)=>{const a=el('article');a.append(el('h3',(i+1)+'. '+q.prompt));q.options.forEach((v,j)=>{const b=button((j+1)+'. '+v,()=>{record.answers[i]=j;record.graded=false;save();quiz(qs,key)});if(record.answers[i]===j)b.className='selected';a.append(b)});a.append(el('p','자신감'));['확실','헷갈림','모름'].forEach(v=>{const b=button(v,()=>{record.confidence[i]=v;save();quiz(qs,key)});if(record.confidence[i]===v)b.className='selected';a.append(b)});if(record.graded)a.append(el('p',(record.answers[i]===q.answer?'정답':'다시 확인')+' · '+q.explanation));m.append(a)});const note=el('textarea');note.setAttribute('aria-label','오늘의 정리');note.placeholder='오늘의 오답·표현·질문을 정리하세요.';note.value=record.note;note.oninput=()=>{record.note=note.value;save()};m.append(note,button('채점',()=>{record.graded=true;save();quiz(qs,key)}));if(record.graded)m.append(el('p',qs.filter((q,i)=>record.answers[i]===q.answer).length+' / '+qs.length+' 정답'));const a=el('a','의학용어 출처: MedlinePlus');a.href='https://medlineplus.gov/appendixa.html';a.target='_blank';a.rel='noopener noreferrer';m.append(a)}
function dictionary(){const m=$('#main');m.replaceChildren(el('h2','사전·예문 검색'));m.append(el('p','사전 데이터를 복제하거나 내장한 것이 아니라, 검색어를 공식/외부 사전으로 전달합니다. 뜻·예문·발음은 새 창에서 확인하세요.'));const lang=el('select');[['en','영어 Cambridge'],['ja','일본어 Jisho'],['es','스페인어 RAE']].forEach(([v,t])=>{const o=el('option',t);o.value=v;lang.append(o)});const input=el('input');input.placeholder='단어 입력';input.setAttribute('aria-label','사전 검색어');m.append(lang,input,button('사전에서 뜻·예문 보기',()=>{const q=encodeURIComponent(input.value.trim());if(!q)return;const url=lang.value==='en'?'https://dictionary.cambridge.org/dictionary/english/'+q:lang.value==='ja'?'https://jisho.org/search/'+q:'https://dle.rae.es/'+q;window.open(url,'_blank','noopener,noreferrer')}))}
function date(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date())}function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}const nav=$('#nav');[['15일 학습계획',plans],['연수 영어 20문항',()=>quiz(australia(),'au-'+date())],['의학용어 15문항',()=>quiz(medical(),'med-'+date())],['혼합 랜덤 10문항',()=>{const pools=['en','ja','es'].map(l=>shuffle(bank.filter(q=>q.language===l)).slice(0,2));quiz(shuffle(pools.flat().concat(shuffle(medical()).slice(0,4))),'random-'+Date.now())}],['사전 검색',dictionary],['기록 백업',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));const a=el('a');a.href=url;a.download='language-hub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}]].forEach(([s,fn])=>nav.append(button(s,fn)));
fetch('hub-lessons.json').then(r=>{if(!r.ok)throw Error('문제은행 불러오기 실패');return r.json()}).then(list=>{bank=list.flatMap(l=>l.questions.filter(q=>q.type==='mc').map(q=>({...q,language:l.language||'en'})));plans()}).catch(e=>$('#main').textContent=e.message);
</script></html>
