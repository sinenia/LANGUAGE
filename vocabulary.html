<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 통합 단어장</title><style>body{max-width:900px;margin:auto;padding:24px;font:16px/1.7 system-ui;background:#fbfaf5;color:#243c36}article{padding:18px;margin:12px 0;border:1px solid #ddd;background:white;border-radius:12px}input,select,button{font:inherit;padding:10px;margin:4px}button{cursor:pointer}.active{background:#cde5d5}</style><a href="index.html">← 학습실</a> · <a href="hub.html">학습관·사전</a><a href="open-dictionary.html" style="display:block;padding:15px">공개 사전 · 15,000개 검색 / 단어 저장 / 회상 퀴즈</a><h1>나의 통합 단어장</h1><p>사이트 학습자료와 이 브라우저에 저장한 학습지의 단어를 모았습니다. 외부 사전 전체를 복제한 데이터가 아닙니다.</p><input id="search" aria-label="단어 뜻 예문 검색" placeholder="단어·뜻·예문 검색"><select id="lang" aria-label="언어"><option value="all">모든 언어</option><option value="en">영어</option><option value="ja">일본어</option><option value="es">스페인어</option></select><select id="status" aria-label="기억 상태"><option value="all">모든 상태</option><option>기억남</option><option>헷갈림</option><option>모름</option></select><label><input type="checkbox" id="hide">뜻 가리기</label><p id="count" role="status"></p><main id="words"></main><script>
const seed=[{"id":"en-diagnostic-v1","language":"en","title":"영어 수준 재진단 · 기본부터 도전까지","focus":"Day 1이 쉬웠다는 피드백 반영 · 공식 등급 판정 아님","grammar":"진단에서는 먼저 문제를 풀어주세요. 정답률과 자신감은 다음 준비된 학습지를 고르는 참고로 사용합니다. 공식 토익 점수나 CEFR 등급으로 환산하지 않습니다.","passage":"Answer independently. Mark your confidence for each question.","translation":"스스로 답하고 각 문항의 자신감을 표시하세요.","vocab":[],"questions":[{"type":"mc","prompt":"Had I known about the cancellation, I _____ earlier.","options":["leave","will leave","would have left","have left","leaving"],"answer":2,"explanation":"과거 사실의 반대 가정: Had I known = If I had known. would have + p.p.를 씁니다."},{"type":"mc","prompt":"The report, along with its supporting documents, _____ due tomorrow.","options":["are","is","be","have","being"],"answer":1,"explanation":"주어는 단수 The report이며 along with 구는 수를 바꾸지 않습니다."},{"type":"mc","prompt":"No sooner had the meeting begun _____ the fire alarm rang.","options":["when","than","that","as","until"],"answer":1,"explanation":"No sooner ... than 구문입니다."},{"type":"mc","prompt":"The proposal requires _____ before approval.","options":["revise","revised","revising","to revising","revisioning"],"answer":2,"explanation":"require + 동명사는 ‘~될 필요가 있다’를 나타낼 수 있습니다."},{"type":"mc","prompt":"Please submit the form _____ Friday at the latest.","options":["during","until","by","since","while"],"answer":2,"explanation":"완료 기한은 by입니다."},{"type":"mc","prompt":"Only after the audit _____ the missing records.","options":["we discovered","did we discover","we did discover","discover we","had discover"],"answer":1,"explanation":"Only + 부사구가 앞에 오면 주절에서 도치합니다."},{"type":"mc","prompt":"Despite _____, the shipment arrived on time.","options":["it rained","the heavy rain","was raining","although rain","rain heavily"],"answer":1,"explanation":"전치사 despite 뒤에는 명사구가 옵니다."},{"type":"mc","prompt":"Employees are advised to retain receipts in case reimbursement _____ requested.","options":["is","are","being","have","to be"],"answer":0,"explanation":"reimbursement는 단수 취급하며 is requested 수동태입니다."},{"type":"mc","prompt":"Which means ‘잠정적인 일정’?","options":["a mandatory schedule","a tentative schedule","an overdue schedule","a confidential schedule","a permanent schedule"],"answer":1,"explanation":"tentative는 잠정적인, 확정되지 않은 뜻입니다."},{"type":"mc","prompt":"The venue is subject to change. What does this imply?","options":["It has already changed.","It cannot change.","It may change.","It is permanently closed.","It is free."],"answer":2,"explanation":"subject to change는 변경될 수 있음을 뜻합니다."},{"type":"mc","prompt":"The supplier offered a refund rather than a replacement. What was offered?","options":["A new item","Money back","Free delivery","A discount on rent","A repair"],"answer":1,"explanation":"refund는 환불입니다."},{"type":"mc","prompt":"The revised policy takes effect on Monday. When does it become applicable?","options":["Before revision","On Monday","After a year","It already expired","Never"],"answer":1,"explanation":"take effect는 시행되다, 효력이 발생하다입니다."}]},{"id":"2026-11-08","title":"Day 1 · 안내 메일 읽기","focus":"주어·동사 찾기 / will + 동사 / be + p.p.","grammar":"will provide에서 will은 조동사, provide는 본동사입니다. will provide 전체가 동사구입니다. be + p.p.는 수동태를 만들 수 있습니다. The room will be cleaned.에서 will be cleaned는 ‘청소될 것이다’라는 동사구입니다.","passage":"To: All staff\nSubject: Training session\n\nOur office will provide a training session on November 12. The session will begin at 10 a.m. in Room 204. All new employees are required to attend. Please bring your laptop. If you need assistance, contact Ms. Lee by November 10. A confirmation email will be sent after you register.","translation":"수신: 전 직원 / 제목: 교육 세션\n우리 사무실은 11월 12일 교육 세션을 제공할 예정입니다. 세션은 204호에서 오전 10시에 시작합니다. 모든 신입 직원은 참석해야 합니다. 노트북을 가져와 주세요. 도움이 필요하면 11월 10일까지 이 씨에게 연락하세요. 등록 후 확인 이메일이 발송될 예정입니다.","vocab":[["provide","동사","제공하다","We provide training."],["receive","동사","받다","You will receive an email."],["assistance","명사","도움","Thank you for your assistance."],["attend","동사","참석하다","Please attend the meeting."],["require","동사","요구하다","This job requires experience."],["confirm","동사","확인하다","Please confirm your name."],["register","동사","등록하다","Register by Friday."],["contact","동사","연락하다","Contact our office."],["schedule","명사","일정","Check the schedule."],["session","명사","시간·회기","The session starts at ten."],["employee","명사","직원","She is a new employee."],["staff","명사","직원 전체","All staff are welcome."],["department","명사","부서","I work in this department."],["manager","명사","관리자","Ask the manager."],["meeting","명사","회의","The meeting is at noon."],["available","형용사","이용 가능한","A room is available."],["necessary","형용사","필요한","Registration is necessary."],["additional","형용사","추가의","We need additional information."],["annual","형용사","매년의","This is our annual meeting."],["recent","형용사","최근의","Read the recent report."],["promptly","부사","신속히","Please reply promptly."],["carefully","부사","주의 깊게","Read the email carefully."],["currently","부사","현재","She currently works here."],["before","전치사","~전에","Arrive before ten."],["during","전치사","~동안","No calls during the session."],["deadline","명사","마감일","The deadline is Monday."],["equipment","명사","장비","Check the equipment."],["instruction","명사","지시·설명","Follow each instruction."],["location","명사","장소","Confirm the location."],["confirmation","명사","확인","You will receive confirmation."]],"questions":[{"type":"mc","prompt":"Our office will _____ a training session.","options":["providing","provides","provide","provided","provision"],"answer":2,"explanation":"조동사 will 뒤에는 동사원형 provide가 옵니다."},{"type":"mc","prompt":"A confirmation email will _____ after you register.","options":["send","be sent","sending","sent","be send"],"answer":1,"explanation":"이메일은 발송되는 대상이므로 will be + p.p.인 will be sent를 씁니다."},{"type":"mc","prompt":"What should employees bring?","options":["A report","A passport","A notebook","A laptop","A ticket"],"answer":3,"explanation":"Please bring your laptop.에서 직접 확인할 수 있습니다."},{"type":"mc","prompt":"By when should employees contact Ms. Lee if they need help?","options":["November 10","November 11","November 12","November 13","November 14"],"answer":0,"explanation":"contact Ms. Lee by November 10: 11월 10일까지 연락하라는 뜻입니다."},{"type":"mc","prompt":"Which word is closest in meaning to assistance?","options":["payment","training","equipment","arrival","help"],"answer":4,"explanation":"assistance는 도움이라는 뜻으로 help와 가깝습니다."},{"type":"written","prompt":"Our office will provide a training session.의 주어와 동사구를 각각 써보세요.","sample":"주어: Our office / 동사구: will provide","explanation":"주어는 행위의 주체이고, will provide 전체가 미래의 행위를 나타냅니다."},{"type":"written","prompt":"‘저는 확인 이메일을 받을 것입니다.’를 영어로 써보세요.","sample":"I will receive a confirmation email.","explanation":"will 뒤에는 receive를 동사원형으로 씁니다. email은 셀 수 있는 단수명사라 a를 씁니다."},{"type":"written","prompt":"교육에 참석할 수 없어서 날짜 변경이 가능한지 묻는 영어 문장을 써보세요.","sample":"I cannot attend the training session. Could I attend on another date?","explanation":"여러 답이 가능합니다. 불참 사유 또는 상황과 정중한 요청이 전달되는지 확인하세요."}],"language":"en"},{"id":"ja-day-01","language":"ja","title":"Day 1 · 인사와 소개","focus":"기초 시작 학습 · 수준 미확인","grammar":"は는 주제를 나타내며 조사로 쓰일 때 ‘와’로 읽습니다. です는 정중한 서술 표현입니다. 私(わたし), 学生(がくせい).","vocab":[["こんにちは","인사","안녕하세요","こんにちは。"],["私","대명사","나","私は学生です。"],["学生","명사","학생","学生です。"],["名前","명사","이름","お名前は何ですか。"],["です","표현","~입니다","アキです。"]],"passage":"私はアキです。学生です。どうぞよろしくお願いします。","translation":"저는 아키입니다. 학생입니다. 잘 부탁드립니다.","questions":[{"type":"mc","prompt":"‘저는 학생입니다’를 고르세요.","options":["私は学生です。","私を学生です。","私に学生です。","私で学生です。","私の学生です。"],"answer":0,"explanation":"저는 아키입니다. 학생입니다. 잘 부탁드립니다."},{"type":"written","prompt":"지문에서 배운 표현으로 나에게 맞는 한 문장을 쓰세요.","sample":"私はアキです","explanation":"예시와 달라도 문법과 의미가 자연스러우면 가능합니다. 자동 채점하지 않습니다."}]},{"id":"ja-day-02","language":"ja","title":"Day 2 · 시간과 일과","focus":"기초 시작 학습 · 수준 미확인","grammar":"특정 시각에는 に를 씁니다. 七時(しちじ), 八時(はちじ), 起きます(おきます).","vocab":[["今日","명사","오늘","今日は月曜日です。"],["明日","명사","내일","明日勉強します。"],["勉強","명사","공부","日本語を勉強します。"],["朝","명사","아침","朝起きます。"],["時","접미사","시","七時です。"]],"passage":"私は毎朝七時に起きます。八時に日本語を勉強します。","translation":"저는 매일 아침 7시에 일어납니다. 8시에 일본어를 공부합니다.","questions":[{"type":"mc","prompt":"화자가 일어나는 시각은?","options":["六時","八時","七時","九時","十時"],"answer":2,"explanation":"저는 매일 아침 7시에 일어납니다. 8시에 일본어를 공부합니다."},{"type":"written","prompt":"지문에서 배운 표현으로 나에게 맞는 한 문장을 쓰세요.","sample":"私は毎朝七時に起きます","explanation":"예시와 달라도 문법과 의미가 자연스러우면 가능합니다. 자동 채점하지 않습니다."}]},{"id":"ja-day-03","language":"ja","title":"Day 3 · 주문하기","focus":"기초 시작 학습 · 수준 미확인","grammar":"を는 목적어를 나타냅니다. も는 ‘~도’입니다. 水(みず), お茶(おちゃ), 一つ(ひとつ).","vocab":[["水","명사","물","水をください。"],["お茶","명사","차","お茶を飲みます。"],["ください","표현","주세요","これをください。"],["一つ","수량","하나","一つください。"],["これ","대명사","이것","これです。"]],"passage":"すみません。お茶を一つください。水もください。","translation":"실례합니다. 차 하나 주세요. 물도 주세요.","questions":[{"type":"mc","prompt":"화자가 주문한 것은?","options":["커피와 물","차와 물","차와 우유","주스와 물","차만"],"answer":1,"explanation":"실례합니다. 차 하나 주세요. 물도 주세요."},{"type":"written","prompt":"지문에서 배운 표현으로 나에게 맞는 한 문장을 쓰세요.","sample":"すみません","explanation":"예시와 달라도 문법과 의미가 자연스러우면 가능합니다. 자동 채점하지 않습니다."}]},{"id":"es-day-01","language":"es","title":"Day 1 · 인사와 소개","focus":"기초 시작 학습 · 수준 미확인","grammar":"soy는 ser의 1인칭 단수 현재형입니다. Me llamo ...는 ‘제 이름은 ...입니다’입니다. español의 ñ는 n과 다른 글자입니다.","vocab":[["hola","인사","안녕","Hola, Ana."],["soy","동사","나는 ~이다","Soy estudiante."],["estudiante","명사","학생","Soy estudiante."],["nombre","명사","이름","Mi nombre es Ana."],["gracias","인사","감사합니다","Muchas gracias."]],"passage":"Hola. Me llamo Ana. Soy estudiante. Estudio español.","translation":"안녕하세요. 제 이름은 아나입니다. 저는 학생입니다. 스페인어를 공부합니다.","questions":[{"type":"mc","prompt":"Soy estudiante.의 뜻은?","options":["나는 학생입니다","너는 학생입니다","그는 의사입니다","우리는 학생입니다","나는 선생님입니다"],"answer":0,"explanation":"안녕하세요. 제 이름은 아나입니다. 저는 학생입니다. 스페인어를 공부합니다."},{"type":"written","prompt":"지문에서 배운 표현으로 나에게 맞는 한 문장을 쓰세요.","sample":"Hola.","explanation":"예시와 달라도 문법과 의미가 자연스러우면 가능합니다. 자동 채점하지 않습니다."}]},{"id":"es-day-02","language":"es","title":"Day 2 · 일과와 현재형","focus":"기초 시작 학습 · 수준
